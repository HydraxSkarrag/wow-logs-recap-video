<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scene: our nemesis bosses</title>
<style>
  /* One scene, 1920 x 1080. renderAt(t) draws the exact state at second t. */
  :root { --wow:#FFD100; --ol:0 0 2px #000,2px 2px 0 #000,-1px -1px 0 #000; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:#0c0d10; }
  #stage { position:relative; width:1920px; height:1080px; overflow:hidden; transform-origin:0 0;
    background:radial-gradient(ellipse at 45% 40%, #3a2412 0%, #1b1008 70%, #0d0805 100%); font-family:Georgia, serif; }
  .title { position:absolute; left:120px; top:140px; font:700 96px Georgia, serif; color:var(--wow); text-shadow:var(--ol); }
  .panel { position:absolute; left:120px; top:320px; width:1300px; padding:30px 36px; background:rgba(10,7,4,.9);
    border:3px solid #b8902f; box-shadow:inset 0 0 0 2px #3b2a10; }
  .row { display:flex; align-items:center; gap:26px; margin:14px 0; }
  .name { width:380px; white-space:nowrap; font:700 44px Georgia, serif; color:#fff; text-shadow:var(--ol); }
  .bar { flex:1; height:56px; background:#120c06; border:2px solid #000; position:relative; }
  .bar i { position:absolute; left:0; top:0; bottom:0; background:linear-gradient(#ffe27a,#e0a514 45%,#a8700c); }
  .val { width:160px; text-align:right; font:700 52px Georgia, serif; color:var(--wow); text-shadow:var(--ol); }
  #ctl { position:fixed; left:0; right:0; bottom:0; display:flex; gap:10px; padding:8px; background:#16181d; }
  #ctl input { flex:1; }
</style>
</head>
<body>
<div id="stage">
  <div class="title">Our nemesis bosses</div>
  <div class="panel" id="list"></div>
</div>
<div id="ctl"><button id="play">Play</button><input id="seek" type="range" min="0" max="8" step="0.01" value="0"></div>
<script>
// Data: the agent fills this from your logs
const DATA = [['Yogg-Saron', 71], ["M'uru", 65], ['Four Horsemen', 49]];
const DURATION = 8;

const ease = x => x * x * (3 - 2 * x);
const clamp = x => Math.max(0, Math.min(1, x));
const max = Math.max(...DATA.map(d => d[1]));
document.getElementById('list').innerHTML = DATA.map(([n, v]) =>
  `<div class="row"><div class="name">${n}</div><div class="bar"><i></i></div><div class="val">${v}</div></div>`).join('');
const rows = [...document.querySelectorAll('.row')];

// The only rule: everything on screen depends on t, nothing else
function renderAt(t) {
  document.querySelector('.title').style.opacity = ease(clamp(t / 0.5));
  rows.forEach((r, i) => {
    const a = 0.8 + i * 0.5;
    r.style.opacity = ease(clamp((t - a) / 0.3));
    r.querySelector('i').style.width = (DATA[i][1] / max * 100 * ease(clamp((t - a) / 0.6))) + '%';
  });
}

// Preview in the browser (hidden while rendering)
const RENDER = location.search.includes('render=1');
if (RENDER) document.getElementById('ctl').style.display = 'none';
else {
  const k = Math.min(innerWidth / 1920, (innerHeight - 50) / 1080);
  document.getElementById('stage').style.transform = `scale(${k})`;
}
let t = 0, playing = false, last = 0;
const seek = document.getElementById('seek');
document.getElementById('play').onclick = () => { playing = !playing; };
seek.oninput = () => { t = +seek.value; renderAt(t); };
requestAnimationFrame(function tick(now) {
  if (playing) { t = (t + (now - last) / 1000) % DURATION; seek.value = t; renderAt(t); }
  last = now; requestAnimationFrame(tick);
});
window.renderAt = renderAt;
document.fonts.ready.then(() => { renderAt(0); document.body.dataset.ready = '1'; });
</script>
</body>
</html>
